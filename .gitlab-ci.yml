# Build the VNovel core and publish a release bundle.
#
# On every push and tag: build for Linux x86_64 + aarch64 and for Windows
# x86_64, then assemble one archive per platform containing the single
# self-contained core (runtime and both ONScripter engines linked in, KiriKiri
# compiled in), the core-info file, the game database and install.sh. On a tag,
# the archives are attached to a GitLab Release.
#
# The core is a single artifact: make produces vnovel_libretro.so with every
# engine inside it, and no engine module is built or bundled here.

stages:
  - build
  - package
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0
  PACKAGE_DIR: dist

# build

.build_template: &build_common
  stage: build
  artifacts:
    name: "vnovel-$CI_COMMIT_REF_SLUG-$PLATFORM"
    paths:
      - dist/
    expire_in: 4 weeks
  script:
    - make -j"$(nproc)"
    - sh ci/package.sh "$PLATFORM"

build:linux-x86_64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: linux-x86_64
  before_script:
    # cmake and ninja are not optional: the KiriKiri engine is built by its own
    # CMake project, and without them the build dies with "cmake: not found"
    # after compiling most of the core. libsdl2-dev, libfontconfig-dev and
    # libvorbis-dev likewise: the engine's CMake requires sdl2 and looks for
    # the other two, so their absence is a configure failure, not a warning.
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config ca-certificates python3
      cmake ninja-build libfreetype-dev libsdl2-dev libfontconfig-dev
      libvorbis-dev
  script:
    - make -j"$(nproc)"
    - sh ci/package.sh "$PLATFORM"
    - sh ci/deb.sh amd64 "$(sh ci/version.sh | sed 's/^v//')" vnovel_libretro.so

build:linux-aarch64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: linux-aarch64
  before_script:
    # freetype must be the *arm64* build for the cross link; the amd64
    # libfreetype-dev the other jobs use would fail at the link step with
    # "cannot find -lfreetype". Debian resolves this with multiarch: keep
    # amd64 packages from the default mirror and pull arm64 from the same
    # archive explicitly.
    #
    # SDL2, fontconfig and vorbis need the same treatment for the same reason,
    # and are not optional: the engine's CMake requires sdl2 through
    # pkg-config, so without the arm64 .pc files the configure step fails
    # before anything is compiled. The Makefile's aarch64 block already points
    # pkg-config at /usr/lib/aarch64-linux-gnu/pkgconfig, which is where these
    # install.
    - dpkg --add-architecture arm64
    - 'sed -i "s/^Types: deb$/Types: deb\\nArchitectures: amd64/" /etc/apt/sources.list.d/debian.sources'
    # The arm64 side must list the SAME suites the amd64 side has, or apt sees
    # two architectures with different candidate versions of the same library
    # and refuses to solve: with only stable+trixie listed for arm64, an
    # amd64-side point update (stable-updates) made libpcre2-8-0:arm64 a
    # release behind and the install died with "Unable to correct problems, you
    # have held broken packages", which says nothing about the real cause.
    - 'echo "deb [arch=arm64] http://deb.debian.org/debian stable main" > /etc/apt/sources.list.d/arm64.list'
    - 'echo "deb [arch=arm64] http://deb.debian.org/debian stable-updates main" >> /etc/apt/sources.list.d/arm64.list'
    - 'echo "deb [arch=arm64] http://deb.debian.org/debian-security stable-security main" >> /etc/apt/sources.list.d/arm64.list'
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config ca-certificates python3
      cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - apt-get install -y -qq libfreetype-dev:arm64 libsdl2-dev:arm64
      libfontconfig-dev:arm64 libvorbis-dev:arm64
  script:
    - make -j"$(nproc)" platform=aarch64
    - sh ci/package.sh "$PLATFORM"
    - sh ci/deb.sh arm64 "$(sh ci/version.sh | sed 's/^v//')" vnovel_libretro.so

build:windows-x86_64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: windows-x86_64
  before_script:
    # Same as the Linux job, plus the cross toolchain. zip is what package.sh
    # needs for the Windows bundle. libz-mingw-w64-dev is what the vendored
    # freetype builds against: Debian ships no mingw freetype, so the engine's
    # freetype comes from tools/build-mingw-vorbis.sh, and that one needs a
    # zlib for the mingw target (nothing else in the tree does).
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config ca-certificates python3
      cmake ninja-build zip unzip gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      mingw-w64-tools libz-mingw-w64-dev
  script:
    # The static vorbis the engine links comes first and is separate: without
    # it the engine builds with no .ogg decoder, silently.
    - tools/build-mingw-vorbis.sh
    - make -j"$(nproc)" platform=mingw
    - sh ci/package.sh "$PLATFORM"

# package

# Packaging happens inside each build job (the artifacts are the bundle), so
# this stage only verifies the bundles before a release. The checks themselves
# live in ci/verify-bundle.sh, shared with the GitHub workflow and runnable
# locally — a second copy of them here would be a second thing to keep in step.
verify-bundles:
  stage: package
  image: debian:stable
  needs:
    - build:linux-x86_64
    - build:linux-aarch64
    - build:windows-x86_64
  before_script:
    # unzip for the Windows bundle, objdump (binutils) for the DLL's import
    # table, ar (also binutils) and tar for the .deb — and xz-utils, because a
    # .deb's data/control members are xz-compressed and tar shells out to xz.
    # Without it the .deb checks die on "xz: Cannot exec", which looks like a
    # corrupt package rather than a missing tool.
    - apt-get update -qq
    - apt-get install -y -qq binutils unzip zip xz-utils
  script:
    - ls -l dist/
    - sh ci/verify-bundle.sh dist/*

# release

# The bundles are the build jobs' own artifacts, so a release needs no link
# generation here: the release-cli step only creates the Release, and the
# per-platform artifacts are attached to it by their job's `artifacts:` entry
# (GitLab links a tag build's artifacts from the Release page).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # The bundles are the build jobs' artifacts. The links below use GitLab's
    # documented per-job artifact endpoint, which is always valid for a tag:
    #   /-/jobs/artifacts/<ref>/download?job=<job>
    # (The /-/releases/<tag>/downloads/<file> form would need each file
    # uploaded through the release API, which this pipeline does not do.)
    - ls -l dist/
  release:
    tag_name: $CI_COMMIT_TAG
    name: "VNovel $CI_COMMIT_TAG"
    description: |
      Multi-engine libretro core for Japanese visual novels
      (ONScripter-EN, PONScripter, KiriKiri/KAG).

      Installation: unpack the archive for your platform and run
      `./install.sh`.

      See [CHANGELOG.md]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md)
      for what changed.
    assets:
      links:
        - name: "linux-x86_64 (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:linux-x86_64"
        - name: "linux-aarch64 (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:linux-aarch64"
        - name: "windows-x86_64 (zip)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:windows-x86_64"
        - name: "Debian packages (amd64, arm64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:linux-x86_64"
