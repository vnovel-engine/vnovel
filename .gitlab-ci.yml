# Build the VNovel core and publish a release bundle.
#
# On every push and tag: build for Linux x86_64 + aarch64 and for Windows
# x86_64, then assemble one archive per platform containing the single
# self-contained core (runtime and both ONScripter engines linked in, KiriKiri
# compiled in), the core-info file, the game database and install.sh. On a tag,
# the archives are attached to a GitLab Release.
#
# The core is a single artifact: make produces vnovel_libretro.so with every
# engine inside it, and no engine module is built or bundled here.

stages:
  - lint
  - build
  - package
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0
  PACKAGE_DIR: dist

# --- lint --------------------------------------------------------------------

# Enforce the libretro coding standards on this repository's own sources only.
# The engine forks under deps/ and smpeg/ keep upstream formatting, so they are
# excluded: reformatting them would make every future upstream merge a
# conflict. `.clang-format` encodes the standard (three-space indent, Allman
# braces, 80 columns).
lint:format:
  stage: lint
  image: silkeh/clang:latest
  script:
    - clang-format --version
    - |
      files=$(ls src/*.c src/*.cpp src/*.h 2>/dev/null)
      bad=0
      for f in $files; do
        if ! clang-format --dry-run --Werror "$f" >/dev/null 2>&1; then
          echo "needs formatting: $f"
          clang-format "$f" | diff -u "$f" - | head -40
          bad=1
        fi
      done
      [ "$bad" -eq 0 ] || { echo "run: clang-format -i src/*.c src/*.cpp src/*.h"; exit 1; }
      echo "formatting OK ($(echo $files | wc -w) files)"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- build -------------------------------------------------------------------

.build_template: &build_common
  stage: build
  artifacts:
    name: "vnovel-$CI_COMMIT_REF_SLUG-$PLATFORM"
    paths:
      - dist/
    expire_in: 4 weeks
  script:
    - make -j"$(nproc)"
    - sh ci/package.sh "$PLATFORM"

build:linux-x86_64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: linux-x86_64
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config libfreetype-dev
      ca-certificates python3

build:linux-aarch64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: linux-aarch64
  before_script:
    # freetype must be the *arm64* build for the cross link; the amd64
    # libfreetype-dev the other jobs use would fail at the link step with
    # "cannot find -lfreetype". Debian resolves this with multiarch: keep
    # amd64 packages from the default mirror and pull arm64 from the same
    # archive explicitly.
    - dpkg --add-architecture arm64
    - 'sed -i "s/^Types: deb$/Types: deb\\nArchitectures: amd64/" /etc/apt/sources.list.d/debian.sources'
    - 'echo "deb [arch=arm64] http://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/arm64.list'
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config ca-certificates python3
      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - apt-get install -y -qq libfreetype-dev:arm64
  script:
    - make -j"$(nproc)" platform=aarch64
    - sh ci/package.sh "$PLATFORM"

build:windows-x86_64:
  extends: .build_template
  image: debian:stable
  variables:
    PLATFORM: windows-x86_64
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential pkg-config ca-certificates
      gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools python3
  script:
    - make -j"$(nproc)" platform=mingw
    - sh ci/package.sh "$PLATFORM"

# --- package -----------------------------------------------------------------

# Packaging happens inside each build job (the artifacts are the bundle), so
# this stage only verifies the bundles are complete before a release.
verify-bundles:
  stage: package
  image: debian:stable
  needs:
    - build:linux-x86_64
    - build:linux-aarch64
    - build:windows-x86_64
  script:
    - ls -l dist/
    - |
      for a in dist/*.tar.gz dist/*.zip; do
        [ -e "$a" ] || continue
        echo "== $a"
        case "$a" in
          *.zip) unzip -l "$a" ;;
          *)     tar tzf "$a" ;;
        esac
      done
    # Every bundle must carry the single self-contained core, and must NOT
    # carry any engine module: a stray module means the build fell back to the
    # old multi-artifact path.
    - |
      for a in dist/*.tar.gz; do
        [ -e "$a" ] || continue
        tar tzf "$a" | grep -q vnovel_libretro.so || { echo "$a: core missing"; exit 1; }
        if tar tzf "$a" | grep -qE 'vnovel_engine_.*\.so|vnovel_runtime\.so'; then
          echo "$a: stray engine/runtime module in bundle"; exit 1
        fi
        tar tzf "$a" | grep -q install.sh || { echo "$a: installer missing"; exit 1; }
      done
    - echo "bundles complete"

# --- release -----------------------------------------------------------------

# The bundles are the build jobs' own artifacts, so a release needs no link
# generation here: the release-cli step only creates the Release, and the
# per-platform artifacts are attached to it by their job's `artifacts:` entry
# (GitLab links a tag build's artifacts from the Release page).
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # The bundles are the build jobs' artifacts. The links below use GitLab's
    # documented per-job artifact endpoint, which is always valid for a tag:
    #   /-/jobs/artifacts/<ref>/download?job=<job>
    # (The /-/releases/<tag>/downloads/<file> form would need each file
    # uploaded through the release API, which this pipeline does not do.)
    - ls -l dist/
  release:
    tag_name: $CI_COMMIT_TAG
    name: "VNovel $CI_COMMIT_TAG"
    description: |
      Multi-engine libretro core for Japanese visual novels
      (ONScripter-EN, PONScripter, KiriKiri/KAG).

      Installation: unpack the archive for your platform and run
      `./install.sh`.

      See [CHANGELOG.md]($CI_PROJECT_URL/-/blob/$CI_COMMIT_TAG/CHANGELOG.md)
      for what changed.
    assets:
      links:
        - name: "linux-x86_64 (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:linux-x86_64"
        - name: "linux-aarch64 (tar.gz)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:linux-aarch64"
        - name: "windows-x86_64 (zip)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build:windows-x86_64"
